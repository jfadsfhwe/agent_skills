<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck title</title>
  <style>
    :root {
      --space: 8px;
      --bg: #071426;
      --raised: #10243f;
      --line: #2a466c;
      --text: #e8eef7;
      --muted: #9aafc8;
      --accent: #e4a34b;
      --accent-ink: #1c1408;
      --size-title: clamp(1.85rem, 3.6vw, 3.25rem);
      --size-lead: clamp(1.15rem, 1.8vw, 1.5rem);
      --size-body: 1.0625rem;
      --size-meta: 0.8125rem;
      --weight-title: 500;
      --weight-body: 400;
      --font: "Avenir Next", "Avenir", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--size-body);
      font-weight: var(--weight-body);
      line-height: 1.45;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .chrome, .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--space) * 2);
      padding: calc(var(--space) * 2) calc(var(--space) * 3);
    }

    .chrome p, .count {
      margin: 0;
      color: var(--muted);
      font-size: var(--size-meta);
      letter-spacing: 0.04em;
    }

    .mark { color: var(--text); font-weight: var(--weight-title); }

    .stage {
      min-height: 0;
      overflow: hidden;
      padding: 0 calc(var(--space) * 3) calc(var(--space) * 2);
    }

    .slide {
      height: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: calc(var(--space) * 3);
      padding: calc(var(--space) * 3);
      border: 1px solid var(--line);
      background: var(--raised);
      overflow: auto;
    }

    .slide[hidden] { display: none; }

    .kicker {
      margin: 0 0 var(--space);
      color: var(--accent);
      font-size: var(--size-meta);
      font-weight: var(--weight-title);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-weight: var(--weight-title);
      letter-spacing: -0.02em;
      line-height: 1.12;
      max-width: 22ch;
    }

    h1 { font-size: var(--size-title); }
    h2 { font-size: var(--size-lead); }
    h1:focus, h2:focus { outline: none; }

    .lede {
      margin: calc(var(--space) * 2) 0 0;
      max-width: 38ch;
      color: var(--muted);
      font-size: var(--size-lead);
    }

    .split, .pair {
      display: grid;
      gap: calc(var(--space) * 4);
      align-items: center;
      min-height: 0;
    }

    .split { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
    .pair { grid-template-columns: 1fr 1fr; align-items: stretch; }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: calc(var(--space) * 1.5);
    }

    li {
      padding-left: calc(var(--space) * 2);
      border-left: 2px solid var(--accent);
    }

    .figure { margin: 0; min-width: 0; }
    .figure svg { display: block; width: 100%; height: auto; }

    figcaption {
      margin-top: var(--space);
      color: var(--muted);
      font-size: var(--size-meta);
    }

    .panel {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: calc(var(--space) * 2);
      min-width: 0;
    }

    .panel h2 { max-width: none; }
    .panel p { margin: calc(var(--space) * 1.5) 0 0; }

    .nav { border-top: 1px solid var(--line); }

    button {
      font-family: inherit;
      font-size: var(--size-body);
      font-weight: var(--weight-title);
      cursor: pointer;
    }

    .next {
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid transparent;
      padding: calc(var(--space) * 1.25) calc(var(--space) * 3);
    }

    .back {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: calc(var(--space) * 1.25) calc(var(--space) * 2);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 800px) {
      .chrome, .nav, .stage { padding-left: calc(var(--space) * 2); padding-right: calc(var(--space) * 2); }
      .split, .pair { grid-template-columns: 1fr; gap: calc(var(--space) * 2); }
      .slide { padding: calc(var(--space) * 2); }
      h1, h2 { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="chrome">
      <p><span class="mark">Deck title</span></p>
      <p>Author · date</p>
    </header>

    <div class="stage">
      <svg width="0" height="0" aria-hidden="true">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#e4a34b"/>
          </marker>
        </defs>
      </svg>

      <section class="slide" aria-labelledby="s1">
        <div>
          <p class="kicker">Opening</p>
          <h1 id="s1" tabindex="-1">Deck title</h1>
          <p class="lede">One sentence from the source.</p>
        </div>
        <figure class="figure">
          <svg viewBox="0 0 640 200" role="img" aria-label="Replace with a drawing of this slide's point."></svg>
        </figure>
      </section>
    </div>

    <footer class="nav">
      <button class="back" type="button" id="prev">Back</button>
      <p class="count" id="count" aria-live="polite">1 / 1</p>
      <button class="next" type="button" id="next">Next</button>
    </footer>
  </div>

  <script>
    const slides = Array.from(document.querySelectorAll(".slide"));
    const count = document.getElementById("count");
    const next = document.getElementById("next");
    const prev = document.getElementById("prev");
    let index = 0;

    function show(n) {
      index = (n + slides.length) % slides.length;
      slides.forEach((slide, i) => {
        slide.hidden = i !== index;
      });
      count.textContent = (index + 1) + " / " + slides.length;
      next.textContent = index === slides.length - 1 ? "Start over" : "Next";
      history.replaceState(null, "", "#" + (index + 1));
      const heading = slides[index].querySelector("h1, h2");
      if (heading) heading.focus();
    }

    next.addEventListener("click", () => show(index + 1));
    prev.addEventListener("click", () => show(index - 1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
        event.preventDefault();
        show(index + 1);
      } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
        event.preventDefault();
        show(index - 1);
      } else if (event.key === "Home") {
        show(0);
      } else if (event.key === "End") {
        show(slides.length - 1);
      }
    });

    const start = Number(location.hash.replace("#", ""));
    show(Number.isInteger(start) && start >= 1 && start <= slides.length ? start - 1 : 0);
  </script>
</body>
</html>
